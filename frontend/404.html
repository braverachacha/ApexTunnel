<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | ApexTunnel</title>
  <meta name="description" content="Page not found - ApexTunnel" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/scss/main.scss">
</head>
<body class="dark-theme">
  <div class="page-404">
    <!-- Animated Orbs -->
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <!-- Starfield -->
    <div class="stars">
      <!-- Stars injected via JS -->
    </div>

    <!-- Orbiting Planet -->
    <div class="planet"></div>

    <!-- Main Card -->
    <main class="error-card">
      <!-- Animated Astronaut -->
      <div class="astronaut">
        <div class="helmet">
          <div class="visor">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>
        </div>
        <div class="body">
          <div class="chest-panel">
            <div class="chest-light"></div>
          </div>
          <div class="arm left"></div>
          <div class="arm right"></div>
        </div>
      </div>

      <!-- Badge -->
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        ApexTunnel Secure Network
      </div>

      <!-- Error Code -->
      <div class="error-code">404</div>

      <h1>Connection Lost</h1>

      <p>
        The page you're trying to access could not be found.
        It may have been moved, removed, or the tunnel endpoint no longer exists.
      </p>

      <div class="actions">
        <a href="/" class="btn btn--primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Return Home
        </a>
        <a href="javascript:history.back()" class="btn btn--secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Go Back
        </a>
      </div>

      <div class="footer">
        © 2026 ApexTunnel.top • Fast • Secure • Reliable
      </div>
    </main>
  </div>

  <script>
    // Generate starfield
    const starsContainer = document.querySelector('.stars');
    const starCount = 120;

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
      star.style.setProperty('--opacity', (Math.random() * 0.7 + 0.3).toFixed(2));
      star.style.setProperty('--delay', (Math.random() * 4).toFixed(2) + 's');
      starsContainer.appendChild(star);
    }

    // Shooting stars
    function createShootingStar() {
      const shootingStar = document.createElement('div');
      shootingStar.className = 'shooting-star';
      shootingStar.style.top = Math.random() * 40 + '%';
      shootingStar.style.left = Math.random() * 30 + '%';
      shootingStar.style.setProperty('--delay', '0s');
      starsContainer.appendChild(shootingStar);

      setTimeout(() => shootingStar.remove(), 4000);
    }

    setInterval(createShootingStar, 5000);
    setTimeout(createShootingStar, 2000);

    // Mouse parallax on astronaut
    const astronaut = document.querySelector('.astronaut');
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 15;
      const y = (e.clientY / window.innerHeight - 0.5) * 15;
      astronaut.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
