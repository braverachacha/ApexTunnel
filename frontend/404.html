<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | ApexTunnel</title>
  <meta name="description" content="Page not found - ApexTunnel" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #13203d 0%, #08101f 45%, #02050c 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
      z-index: 0;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: rgba(0, 183, 255, 0.15);
      filter: blur(120px);
      border-radius: 50%;
      top: -120px;
      right: -100px;
      z-index: 0;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      width: 92%;
      text-align: center;
      padding: 60px 40px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(0, 183, 255, 0.12);
      border: 1px solid rgba(0, 183, 255, 0.25);
      color: #7ddcff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .code {
      font-size: clamp(90px, 16vw, 180px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -8px;
      background: linear-gradient(135deg, #ffffff 0%, #76d6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      margin-bottom: 18px;
      font-weight: 700;
    }

    p {
      color: rgba(255,255,255,0.72);
      font-size: 18px;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 36px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      padding: 14px 26px;
      border-radius: 14px;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00b7ff 0%, #007bff 100%);
      color: white;
      box-shadow: 0 10px 30px rgba(0, 140, 255, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(0, 140, 255, 0.45);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 42px;
      color: rgba(255,255,255,0.45);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 42px 24px;
      }

      p {
        font-size: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style></head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>  <main class="container">
    <div class="badge">
      ⚡ ApexTunnel Secure Network
    </div><div class="code">404</div>

<h1>Connection Lost</h1>

<p>
  The page you're trying to access could not be found.
  It may have been moved, removed, or the tunnel endpoint no longer exists.
</p>

<div class="actions">
  <a href="/" class="btn btn-primary">Return Home</a>
  <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
</div>

<div class="footer">
  © 2026 ApexTunnel.top • Fast • Secure • Reliable
</div>

  </main>
</body>
</html>
